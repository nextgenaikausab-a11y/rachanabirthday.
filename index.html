<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Happy Birthday Rachana!</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d0614;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #ffffff;
    }

    /* Canvas covers full screen */
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: block;
    }

    /* Overlay container */
    .overlay-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      pointer-events: none;
    }

    /* Glassmorphism card - Expanded for longer message */
    .card-content {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 36px 40px;
      width: 90%;
      max-width: 680px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.5rem;
      font-weight: 600;
      color: #ffb7d5;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    .message {
      font-size: 1.15rem;
      line-height: 1.8;
      color: #f3e8ee;
      min-height: 120px;
      white-space: pre-wrap;
    }

    /* Typewriter Cursor */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.2em;
      background-color: #ffb7d5;
      margin-left: 2px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @media (max-width: 600px) {
      .card-content {
        padding: 24px 20px;
      }
      h1 {
        font-size: 2rem;
      }
      .message {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="overlay-container">
    <div class="card-content">
      <h1>Happy Birthday, Rach ❤️</h1>
      <div class="message"><span id="typewriter"></span><span class="cursor"></span></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Heart Animation Logic
    const hearts = [];
    class Heart {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = -20;
        this.size = Math.random() * 15 + 10;
        this.speed = Math.random() * 1.5 + 0.8;
        this.opacity = Math.random() * 0.7 + 0.3;
        this.swing = Math.random() * 0.05;
        this.angle = Math.random() * Math.PI * 2;
      }
      update() {
        this.y += this.speed;
        this.angle += this.swing;
        this.x += Math.sin(this.angle) * 0.8;
        if (this.y > canvas.height + 20) {
          this.reset();
        }
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = '#ff6b8b';
        ctx.beginPath();
        const topCurveHeight = this.size * 0.3;
        ctx.moveTo(this.x, this.y + topCurveHeight);
        ctx.bezierCurveTo(this.x, this.y, this.x - this.size / 2, this.y, this.x - this.size / 2, this.y + topCurveHeight);
        ctx.bezierCurveTo(this.x - this.size / 2, this.y + (this.size + topCurveHeight) / 2, this.x, this.y + this.size, this.x, this.y + this.size);
        ctx.bezierCurveTo(this.x, this.y + (this.size + topCurveHeight) / 2, this.x + this.size / 2, this.y + topCurveHeight, this.x + this.size / 2, this.y + topCurveHeight);
        ctx.bezierCurveTo(this.x + this.size / 2, this.y, this.x, this.y, this.x, this.y + topCurveHeight);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 40; i++) {
      hearts.push(new Heart());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hearts.forEach(heart => {
        heart.update();
        heart.draw();
      });
      requestAnimationFrame(animate);
    }
    animate();

    // Longer Typewriter Text Message
    const text = "Wishing you a day filled with endless laughter, genuine happiness, and all the love you so truly deserve. May this new year bring you remarkable adventures, continuous success, and memories you'll treasure forever. Thank you for being such an extraordinary presence. Happy Birthday!";
    
    let index = 0;
    function typeWriter() {
      if (index < text.length) {
        document.getElementById('typewriter').innerHTML += text.charAt(index);
        index++;
        setTimeout(typeWriter, 40);
      }
    }
    window.addEventListener('load', typeWriter);
  </script>
</body>
</html>
