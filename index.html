<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>A little birthday surprise for Rachana</title>
  <!-- Main aesthetic fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
  <style>
    /* Reset and Core Layout */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d0614; /* Keep the dark background */
      font-family: 'Poppins', sans-serif; /* Clean body font */
      color: #ffffff;
    }

    /* Full-Screen Canvas for Heart Particle Animation (from image 1) */
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: block;
    }

    /* Overlay Container for Content (to keep it centered and over the canvas) */
    .overlay-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      pointer-events: none; /* Let canvas handle events below */
    }

    /* Top Greeting (from image 2) */
    .top-greeting {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 300;
    }

    /* Glassmorphism Card (from image 1, expanded) */
    .card-content {
      pointer-events: auto; /* Active for interaction */
      background: rgba(255, 255, 255, 0.08); /* Dark glass effect */
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 40px 50px;
      width: 90%;
      max-width: 650px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      position: relative;
    }

    /* Date and Sparkle (from image 2) */
    .card-header-date {
      font-family: 'Poppins', sans-serif;
      font-weight: 300;
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 5px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    /* Main Title (combination of fonts from image 2) */
    h1 {
      font-size: 3.2rem;
      color: #ffb7d5; /* Keep the light pink/purple from image 1 */
      margin-bottom: 25px;
      line-height: 1.1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    h1 span.script {
      font-family: 'Great Vibes', cursive;
      font-size: 3.8rem;
    }
    h1 span.serif {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
    }

    /* Main Message (from image 2, with typewriter effect) */
    .message {
      font-size: 1.05rem;
      line-height: 1.9;
      color: #f3e8ee;
      min-height: 180px;
      white-space: pre-wrap; /* Preserve line breaks if any */
      margin-bottom: 25px;
    }

    /* Typewriter Cursor (from image 1) */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background-color: #ffb7d5;
      margin-left: 2px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    /* Closing and Signature (from image 2) */
    .signature-container {
      font-family: 'Great Vibes', cursive;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    .closing {
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .signature {
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Separators (from image 2) */
    .sep-dot {
      color: #ff6b8b;
      font-size: 1.2rem;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      .card-content { padding: 30px 25px; }
      h1 { font-size: 2.5rem; }
      h1 span.script { font-size: 3rem; }
      .message { font-size: 0.95rem; }
      .top-greeting { font-size: 0.9rem; }
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="overlay-container">
    <div class="top-greeting">
      <span>&#x2764;</span> <!-- Heart -->
      <span>A LITTLE BIRTHDAY SURPRISE FOR <strong>RACHANA</strong></span>
      <span>&#x2764;</span> <!-- Heart -->
    </div>

    <div class="card-content">
      <div class="card-header-date">
        <span>September 2</span>
        <span>&#x2728;</span> <!-- Sparkle -->
      </div>
      
      <h1>
        <span class="script">Happy Birthday,</span>
        <span class="serif">Rach, babe! 🎂 &#x2764;</span>
      </h1>

      <!-- Use the text content from image 2, with the typewriter effect -->
      <div class="message"><span id="typewriter"></span><span class="cursor"></span></div>

      <div class="signature-container">
        <div class="closing">
          <span>Te amo!</span>
          <span>&#x2764;</span>
        </div>
        <div class="signature">
          <span>From kausab</span>
          <span>&#x2764;</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Heart Animation Logic (from image 1)
    const hearts = [];
    class Heart {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = -20;
        this.size = Math.random() * 12 + 8;
        this.speed = Math.random() * 1.8 + 1;
        this.opacity = Math.random() * 0.7 + 0.3;
        this.swing = Math.random() * 0.05;
        this.angle = Math.random() * Math.PI * 2;
      }
      update() {
        this.y += this.speed;
        this.angle += this.swing;
        this.x += Math.sin(this.angle) * 0.8;
        if (this.y > canvas.height + 20) {
          this.reset();
        }
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = '#ff6b8b'; /* Pink/purple color */
        ctx.beginPath();
        const topCurveHeight = this.size * 0.3;
        ctx.moveTo(this.x, this.y + topCurveHeight);
        ctx.bezierCurveTo(this.x, this.y, this.x - this.size / 2, this.y, this.x - this.size / 2, this.y + topCurveHeight);
        ctx.bezierCurveTo(this.x - this.size / 2, this.y + (this.size + topCurveHeight) / 2, this.x, this.y + this.size, this.x, this.y + this.size);
        ctx.bezierCurveTo(this.x, this.y + (this.size + topCurveHeight) / 2, this.x + this.size / 2, this.y + topCurveHeight, this.x + this.size / 2, this.y + topCurveHeight);
        ctx.bezierCurveTo(this.x + this.size / 2, this.y, this.x, this.y, this.x, this.y + topCurveHeight);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 40; i++) {
      hearts.push(new Heart());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hearts.forEach(heart => {
        heart.update();
        heart.draw();
      });
      requestAnimationFrame(animate);
    }
    animate();

    // Typewriter Text Effect (from image 2 text)
    const text = "Happy Birthday to the one who makes my world so much brighter. Being with you is my favorite part of every day, and I'm so grateful for every moment we share.\n\nI hope your day is as incredible, loving, and beautiful as you are.";
    
    let index = 0;
    function typeWriter() {
      if (index < text.length) {
        document.getElementById('typewriter').innerHTML += text.charAt(index);
        index++;
        setTimeout(typeWriter, 40); /* Standard speed */
      }
    }
    window.addEventListener('load', typeWriter);
  </script>
</body>
</html>
